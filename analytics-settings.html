<head>
<meta charset="utf-8">

<title>내 방문 집계 설정 | LTH VFX</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script defer src="assets/analytics.js"></script>
<style>
.settings{max-width:680px;padding-top:64px;padding-bottom:64px;line-height:1.8}.settings h1{font-size:32px}.settings-actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.settings button{padding:12px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.settings button:first-child{background:var(--accent);color:var(--bg)}.settings a{color:var(--accent);text-decoration:underline}.settings-note{color:var(--sub);font-size:14px}
</style>

<body><main class="container settings">
<p class="eyebrow">LTH VFX</p>
<h1>내 방문 집계 설정</h1>
<p>이 브라우저에서 포트폴리오를 확인할 때 방문 통계에 포함할지 설정합니다.</p>
<p id="analytics-status" role="status" aria-live="polite">설정을 확인하고 있습니다.</p>
<div class="settings-actions">
<button type="button" data-analytics-exclude="1">내 방문 집계 제외</button>
<button type="button" data-analytics-exclude="0">다시 집계에 포함</button>
</div>
<p class="settings-note">설정은 현재 브라우저에만 저장됩니다. PC·휴대폰·다른 브라우저에서는 각각 설정해 주세요. 사이트 데이터를 삭제하거나 시크릿 창을 사용하면 다시 설정해야 합니다.</p>
<p class="settings-note">이전에 집계된 방문 기록은 변경되지 않습니다. 이 설정 페이지 자체는 집계하지 않습니다.</p>
<noscript><p>설정을 변경하려면 JavaScript를 허용해 주세요.</p></noscript>
